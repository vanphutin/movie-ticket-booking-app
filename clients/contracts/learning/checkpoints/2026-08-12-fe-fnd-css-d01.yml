    limitation: none
  - question_id: LG-FE-TKT-FND-CSS-D01-Q3
    observation: Learner selected rem for root-relative body text, em for component-relative padding, percent for container-relative input width and px for a stable thin border, with mechanisms, trade-offs, change conditions and a bounded responsive card alternative.
    verdict: PASS
