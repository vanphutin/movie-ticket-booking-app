  - question_id: LG-FE-TKT-FND-CSS-D01-Q2
    observation: Learner correctly calculated a 346px content-box outer width and 26px overflow in a 320px container, derived the 294px border-box content width, selected a global border-box rule, and identified min-width, unbreakable content and transforms as independent overflow causes.
