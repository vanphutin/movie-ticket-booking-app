current_questions:
  - id: LG-FE-TKT-FND-CSS-D01-Q1
    dimension: EXPLAIN
    prompt: Two rules target the same input: .auth-form input { color: navy; } and #login-email { color: red; }. Predict the computed color, explain why, and propose a maintainable way to avoid escalating specificity.
  - id: LG-FE-TKT-FND-CSS-D01-Q2
    dimension: APPLY
    prompt: A form control has width 100%, padding 12px and border 1px inside a narrow container. Compare content-box with border-box, predict the overflow risk, and write the sizing rule you would choose.
  - id: LG-FE-TKT-FND-CSS-D01-Q3
    dimension: COMPARE
    prompt: Choose between px, rem, em and percent for body text, component padding, a full-width input and a thin border. Defend each choice and state when you would change it.
  - id: LG-FE-TKT-FND-CSS-D01-Q4
    dimension: FAILURE
    prompt: A designer uses fixed heights, removes outlines and hides visible labels to make the login form compact. Explain the failures and propose CSS that preserves resizing, focus visibility and semantic labeling.
learner_answers:
  - question_id: LG-FE-TKT-FND-CSS-D01-Q1
    observation: Learner correctly predicted red, separated inherited color from declarations directly targeting the input, compared specificity and source order, and selected low-specificity class-based component rules with explicit maintenance trade-offs and change conditions.
