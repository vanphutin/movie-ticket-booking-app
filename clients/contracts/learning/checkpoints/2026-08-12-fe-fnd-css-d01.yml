  - question_id: LG-FE-TKT-FND-CSS-D01-Q4
    observation: Learner correctly traced fixed-height, clipping, localization, validation, visible-label and keyboard-focus failures; proposed resilient sizing and visible focus CSS; and preserved the boundary between presentation and authentication behavior.
