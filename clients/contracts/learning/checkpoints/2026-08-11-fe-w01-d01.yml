  - question_id: LG-FE-TKT-W01-D01-Q4
    observation: Correctly explained placeholder disappearance, label association through for/id, accessible naming and the enlarged activation target.
    verdict: PARTIAL_PASS
    limitation: Stated that assistive-technology users cannot know the control purpose; some browser/AT combinations may expose placeholder text as a fallback, but it is unreliable and not a persistent substitute for a label.
