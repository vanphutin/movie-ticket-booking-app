learner_answers:
  - question_id: LG-FE-TKT-W01-D01-Q1
    observation: Correctly distinguished request, response and stateless HTTP, and explained session evidence through cookies or tokens.
    verdict: PARTIAL_PASS
    limitation: Described Authorization as automatically attached by the browser; unlike matching cookies, bearer Authorization is normally attached explicitly by application code or a configured client mechanism.
  - question_id: LG-FE-TKT-W01-D01-Q2
    observation: Correctly identified the navigation GET HTML response as the document response and traced stylesheet, script and image references to additional resource requests.
    verdict: PASS
    limitation: Parsing was described sequentially; real browsers may discover and fetch independent resources concurrently.
  - question_id: LG-FE-TKT-W01-D01-Q3
    observation: Correctly selected submit button, in-page action button and registration link, with native semantics, keyboard behavior and navigation affordances.
    verdict: PASS
