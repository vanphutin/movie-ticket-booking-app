project_application_task:
  id: LG-FE-TKT-W01-D01-APP-01
  title: Semantic static authentication shell
  constraints:
    - HTML only; no CSS, JavaScript, React, TypeScript, Tailwind or live API call
    - Use document landmarks and one coherent heading hierarchy
    - Use a real form with explicitly associated visible labels
    - Use suitable email and password input types and names
    - Use a submit button for login and a link for registration
    - Include a non-visual decorative image treatment or meaningful alternative text as appropriate
  completion_condition: Learner submits the HTML and defends the semantic choices and one expected native failure behavior.
project_application_review:
  reviewed_at: "2026-08-12"
  verdict: PASS
  observations:
    - Complete Vietnamese HTML document with header, navigation, main and footer landmarks and one coherent h1.
    - Email and password controls use suitable types, names, autocomplete values, required constraints and explicitly associated visible labels.
    - Submit uses a native submit button and registration uses a real link with correct action-versus-navigation reasoning.
    - Learner correctly predicted required and email constraint-validation behavior.
  non_blocking_findings:
    - The static exercise action /api/login is not verified API authority and must not be carried into integration design without a verified public contract.
    - Focus placement and localized validation messages are user-agent behavior and should not be specified as universally identical.
    - Prefer alt text that names the brand without redundantly appending the word Logo when the image is meaningful.
