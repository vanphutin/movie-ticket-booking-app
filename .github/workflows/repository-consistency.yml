name: Repository consistency

on:
  pull_request:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

jobs:
  consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify generated projections and repository consistency
        run: node tools/repository/validate-repository.mjs

      - name: Run consistency negative fixtures
        run: node tools/control-plane/test-consistency.mjs

      - name: Prove regeneration leaves no diff
        run: |
          node tools/control-plane/sync-control-plane.mjs
          git diff --exit-code
