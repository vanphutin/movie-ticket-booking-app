decision_record:
  project_constraints:
    - "Only verified actor may exercise allowed action on owned resource."
    - "Gateway does not own domain state/DB."
  options:
    - name: "Gateway-only Authorization"
      mechanism: "Gateway verifies JWT and queries DB to authorize ownership."
      advantages: ["Centralized checks"]
      disadvantages: ["Coupling, DB bottleneck, violates bounded context"]
      status: "REJECTED"
    - name: "Edge Verification + Owner-Service Authorization"
      mechanism: "Gateway verifies JWT signature/expiry, strips untrusted headers, injects X-User-Id; Microservice evaluates domain ownership."
      advantages: ["Clean architecture, lightweight gateway, domain autonomy"]
      disadvantages: ["Requires trusted network boundary & header stripping"]
      status: "SELECTED"
